# =============================================================================
# Secret 引用与创建示例（不要直接 apply 本文件！）
#
# 示例值全部是占位符。推荐用命令创建，避免明文进入 Git：
#
#   kubectl -n car-monit-api create secret generic car-monit-api-secret \
#     --from-literal=CM_PG_PASSWORD='<真实口令>'
#
#   # 可选：ES 口令等没有 CM_* 环境变量覆盖的配置，通过 config.local.yaml 挂载
#   kubectl -n car-monit-api create secret generic car-monit-api-local-config \
#     --from-file=config.local.yaml=<本地文件>
#
# Deployment 中：
#   * CM_PG_PASSWORD 通过 secretKeyRef 注入环境变量；
#   * config.local.yaml 的挂载方式见 deployment.yaml 中注释掉的 volume 块。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: car-monit-api-secret
  namespace: car-monit-api
  labels:
    app.kubernetes.io/name: car-monit-api
type: Opaque
stringData:
  CM_PG_PASSWORD: "<REPLACE-WITH-REAL-SECRET>"

---
apiVersion: v1
kind: Secret
metadata:
  name: car-monit-api-local-config
  namespace: car-monit-api
  labels:
    app.kubernetes.io/name: car-monit-api
type: Opaque
stringData:
  # 挂载到 /app/configs/config.local.yaml，覆盖同名键。
  config.local.yaml: |
    elasticsearch:
      username: elastic
      password: "<REPLACE-WITH-REAL-SECRET>"
