apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-monit-api
  namespace: car-monit-api
  labels:
    app.kubernetes.io/name: car-monit-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-monit-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # 缩容更保守，避免选主切换与在途请求被频繁打断。
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
      selectPolicy: Max
