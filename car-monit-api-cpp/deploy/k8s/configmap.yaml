# =============================================================================
# 非敏感运行时配置。敏感值（数据库口令、ES 口令等）不要放这里，用 Secret 注入。
#
# 覆盖优先级：configs/config.yaml < configs/config.local.yaml < 环境变量 CM_*
# 因此这里的 CM_* 会覆盖镜像内置 config.yaml 的默认值。
# 地址均为占位示例，部署前替换为实际中间件地址。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: car-monit-api-config
  namespace: car-monit-api
  labels:
    app.kubernetes.io/name: car-monit-api
data:
  CM_SERVER_PORT: "9901"

  CM_PG_HOST: "postgres.example.internal"
  CM_PG_PORT: "5432"
  CM_PG_USER: "gaussdb"
  CM_PG_DATABASE: "RuoYi"
  # 生产建议 require；校验证书用 verify-full 并配置 CM_PG_SSLROOTCERT。
  CM_PG_SSLMODE: "require"
  CM_PG_STATEMENT_TIMEOUT_MS: "30000"

  CM_REDIS_HOST: "redis.example.internal"
  CM_REDIS_PORT: "6379"
  # Redis TLS 默认关闭；生产启用时同时提供 CA/客户端证书（Secret/文件挂载）。
  CM_REDIS_TLS: "false"

  CM_KAFKA_ENABLED: "true"
  CM_KAFKA_BOOTSTRAP: "kafka.example.internal:9092"
  CM_KAFKA_FALLBACK_REDIS: "false"

  CM_ES_HOST: "elasticsearch.example.internal"
  CM_ES_PORT: "9200"

  # 多实例单活：Redis 分布式锁决定谁执行调度与全量/增量同步。
  # 只要副本数 > 1 就必须保持 true；单机部署可改为 false。
  CM_LEADER_ELECTION_ENABLED: "true"
  CM_LEADER_LOCK_KEY: "car-monit:leader"
  CM_LEADER_FAIL_OPEN: "false"

  CM_LOG_JSON: "true"
  CM_LOG_LEVEL: "info"
  CM_SHUTDOWN_TIMEOUT_MS: "30000"
