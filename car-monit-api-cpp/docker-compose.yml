# =============================================================================
# car-monit-api (C++) 本地联调环境
#
# 一条命令起环境：
#   cp deploy/.env.example .env          # 可选，覆盖占位口令
#   docker compose up -d --build
#   curl http://127.0.0.1:9901/health
#   curl 'http://127.0.0.1:9901/metrics?format=prometheus'
#
# 说明：
#   * 口令全部是占位值（.env / 环境变量注入），禁止写真实凭据。
#   * PostgreSQL 首次初始化会执行 deploy/initdb/*.sql；其中只有
#     kafka_message_record 是真实 DDL，其余表是“列名对齐”的占位 schema，
#     生产必须替换为数据仓提供的真实 DDL（详见 deploy/README.md）。
#   * 单实例本地联调关闭 Redis 选主（CM_LEADER_ELECTION_ENABLED=false）；
#     多实例部署必须开启，否则每个实例都会跑调度/同步（见 deploy/k8s/README）。
#   * observability profile 额外拉起 Prometheus + Grafana：
#       docker compose --profile observability up -d
# =============================================================================

name: car-monit-api-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: RuoYi
      POSTGRES_USER: gaussdb
      # 占位口令：可用 .env 的 CM_PG_PASSWORD 覆盖；不要提交真实口令。
      POSTGRES_PASSWORD: ${CM_PG_PASSWORD:-change-me-local}
      TZ: Asia/Shanghai
    ports:
      # 只绑定本机回环，避免把数据库暴露到局域网。
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaussdb -d RuoYi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 本地环境不设密码，仅监听回环端口；生产必须启用认证/TLS。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

  kafka:
    # 官方 Apache Kafka 镜像，KRaft 单节点（无 ZooKeeper）。
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # 容器内（api 服务）用 kafka:9092；宿主机调试用 localhost:9094。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

  api:
    image: ${CAR_MONIT_API_IMAGE:-car-monit-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 数据库：host/port/database 覆盖 config.yaml 中的默认值。
      CM_PG_HOST: postgres
      CM_PG_PORT: "5432"
      CM_PG_USER: gaussdb
      CM_PG_PASSWORD: ${CM_PG_PASSWORD:-change-me-local}
      CM_PG_DATABASE: RuoYi
      # 本地 PostgreSQL 未启用 TLS；生产建议 require/verify-full。
      CM_PG_SSLMODE: disable
      # Redis
      CM_REDIS_HOST: redis
      CM_REDIS_PORT: "6379"
      # Kafka（容器网络内地址）
      CM_KAFKA_ENABLED: "true"
      CM_KAFKA_BOOTSTRAP: kafka:9092
      # 单实例本地联调：关闭选主，后台任务由该实例直接执行。
      CM_LEADER_ELECTION_ENABLED: "false"
      # Elasticsearch 不在本 compose 中；保持默认 localhost:9200，
      # 未调用 ES 时 /health 显示 UNKNOWN（不判为降级），
      # 调用后失败会自动降级到 DB（详见 docs/RUNBOOK.md）。
      CM_LOG_LEVEL: info
      CM_LOG_JSON: "false"
      CM_SERVER_PORT: "9901"
      CM_SHUTDOWN_TIMEOUT_MS: "30000"
    ports:
      - "127.0.0.1:9901:9901"
    volumes:
      - api_logs:/app/logs
      - api_export:/data/export
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9901/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

  # ---------------------------------------------------------------------------
  # 可观测性（可选 profile）：Prometheus 抓取 /metrics?format=prometheus，
  # Grafana 通过 provisioning 自动注册数据源与面板。
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/car-monit-api.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [carmonit]

volumes:
  pg_data:
  redis_data:
  kafka_data:
  api_logs:
  api_export:
  prom_data:
  grafana_data:

networks:
  carmonit:
    driver: bridge
