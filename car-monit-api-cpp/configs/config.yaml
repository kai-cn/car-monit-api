# car-monit-api (C++) 运行时配置。
# 结构与 Java 工程的 application.yml 一一对应，键名保持原样，便于对照与迁移。
server:
  port: 9901
  servlet:
    context-path: /
  # ---- 安全加固（审阅 §5.1 #6）。鉴权/限流为新增能力，默认关闭以对齐 Java
  # 生产实例（Java 的 SecurityInterceptor 在 WebConfig.java 中被整体注释）。
  # 请求体上限与读写超时为安全收紧（原实现 64MB 且无超时）。
  # TLS：本服务监听明文 HTTP，生产由前置网关（Nginx/Envoy）终结 TLS（审阅 §5.4）。
  max-payload-bytes: 1048576   # 1MB
  read-timeout-ms: 30000
  write-timeout-ms: 30000
  auth:
    enabled: false             # true 时校验 X-API-Key / Authorization: Bearer
    # api-key: <密钥>          # 建议写入 config.local.yaml；为空时 fail-closed（全部 401）
  rate-limit:
    enabled: false             # true 时按客户端 IP 固定窗口限流（429）
    requests-per-minute: 600
  # 优雅停机：收到 SIGINT/SIGTERM 后等待在途请求的最长时间；超时强制退出。
  shutdown-timeout-ms: 30000
# 日志轮转：按大小滚动，保留 N 个历史文件（log.1 ... log.N）；max-file-mb=0 关闭。
logging:
  max-file-mb: 50
  max-files: 5
  # 结构化日志（每行 JSON，含 requestId）；等价环境变量 CM_LOG_JSON。
  json: false
spring:
  datasource:
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        # 认证失败（28P01/28000）后允许连接池重建连接的次数。
        # 0 = 熔断，进程内不再自动重连（默认），避免继续消耗 failed_login_attempts。
        reconnect-after-auth-failure: 0
      datasource:
        master:
          url: jdbc:postgresql://192.168.56.10:5432/RuoYi?characterEncoding=UTF-8&useUnicode=true&useSSL=false
          username: gaussdb
          # 口令不落盘：从环境变量读取（PowerShell: $env:CM_PG_PASSWORD="..."）。
          # 支持 ${VAR} 与 ${VAR:-默认值} 两种写法。
          # 也可以把口令写进同目录的 config.local.yaml（会覆盖本行，且已被 .gitignore 忽略）：
          #   spring:
          #     datasource:
          #       dynamic:
          #         datasource:
          #           master:
          #             password: <真实口令>
          # 口令为空或仍是未展开的 ${...} 时，进程会在启动阶段直接退出，不会发起任何连接。
          password: ${CM_PG_PASSWORD}
          driver-class-name: org.postgresql.Driver
          # TLS：libpq sslmode（disable/allow/prefer/require/verify-ca/verify-full）。
          # 默认 prefer 与 libpq 一致；生产建议 require，校验证书用 verify-full 并配置
          # sslrootcert（或使用系统默认 CA）。
          sslmode: ${CM_PG_SSLMODE:-prefer}
          # sslrootcert: /path/to/ca.pem
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 3000
    # TLS 默认关闭（与 Java 侧一致）。开启后使用 hiredis_ssl：
    # ssl: true
    # ssl-cacert: /path/to/ca.pem
    # ssl-cert: /path/to/client-cert.pem
    # ssl-key: /path/to/client-key.pem
  kafka:
    bootstrap-servers: localhost:9092
  pulsar:
    service-url: pulsar://localhost:6650
    topic: persistent://public/default/ods-rt-szdn-snapshot-flow
    producer-name: car-monit-producer
    send-timeout-ms: 30000
    batch-max-messages: 1000
    batch-max-publish-delay-ms: 10
    max-pending-messages: 10000
    subscription-name: ods-rt-szdn-snapshot-flow-sub
    receiver-queue-size: 1000
    ack-timeout-ms: 60000
    max-retry-times: 3
    idempotent-ttl-seconds: 86400
    max-retry-count: 10

rediscluster:
  clusterNodes: 36.200.31.15:22400
  refresh-interval-ms: 300000
isLocalhost: local
sysbaseUrl: http://223.84.150.189:26066/prod-api

kafka:
  # true = 使用 librdkafka 发送真实 Kafka；false = 退回 Redis 队列（mq:pending:<topic>）
  enabled: true
  # 可选降级路径开关：把消息写入 Redis 列表；默认关闭，仅在 kafka 不可用时手工启用
  fallback-redis: false
  bootstrap-servers: localhost:9092
  client-id: car-monit-api
  topic:
    snapshot-flow: ods-rt-szdn-snapshot-flow
  # 与 Java KafkaProducerConfig 一致
  acks: all
  retries: 2147483647
  enable-idempotence: true
  max-in-flight: 5
  batch-size: 16384
  linger-ms: 10
  buffer-memory: 33554432
  compression-type: lz4
  delivery-timeout-ms: 120000
  request-timeout-ms: 30000
  max-retry-count: 10
  retry-interval-ms: 30000
  retry-error-interval-ms: 60000

# CORS（对应 Spring CorsConfiguration；Java 源码未显式配置，
# 这里采用 Spring applyPermitDefaultValues() 的默认值，可覆盖）
cors:
  enabled: true
  path: /**
  allowed-origins: "*"
  allowed-origin-patterns:
  allowed-methods: GET,HEAD,POST
  allowed-headers: "*"
  exposed-headers:
  allow-credentials: false
  max-age: 1800

elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  username: elastic
  password: changeme
  connection-timeout: 30000
  socket-timeout: 30000
  index:
    snapshot: snapshot_flow
    fee: fee_records
    trail: trail_fitting
    shards: 6
    replicas: 1
    auto-create: false
    ilm-policy: car_monit_ilm_policy
    attach-ilm: false

optimization:
  query:
    timeout-ms: 30000
    max-window: 10000
    es-force-days: 30
  export:
    scroll-batch: 2000
    file-batch: 100000
    dir: /data/export
    scroll-keepalive-min: 5

mq:
  topic:
    snapshot-flow: topic_snapshot_flow
  dead-letter:
    exchange: exchange.snapshot.flow.dlx
    queue: queue.snapshot.flow.dlx
    routing-key: snapshot.flow.dlx

sync:
  batch-size: 1000
  full-sync-enabled: true
  incremental-sync-interval: 60000
  es:
    index:
      snapshot: snapshot_flow
      fee: fee_records

consistency:
  reconcile:
    enabled: false
    lookback-months: 3
    drift-ratio: 0.01
    cron: "0 30 2 * * ?"

reliability:
  message-timeout-ms: 30000
  max-retry-count: 5
  compensation-interval-seconds: 60
  alert-threshold-ms: 10000

detection:
  window-size-minutes: 60
  interval-minutes: 30
  loss-threshold-percent: 5

monitoring:
  device-report-threshold-ms: 5000
  message-transfer-threshold-ms: 3000
  data-process-threshold-ms: 10000
  end-to-end-threshold-ms: 30000
  stats-window-minutes: 10

logging:
  level:
    root: INFO
    web: DEBUG
