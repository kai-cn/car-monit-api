name: _python

# 可复用 workflow：Python 3.12 迁移实现。
# 门禁内容原样承自旧 .github/workflows/ci.yml（覆盖率 65% / check_* / 冒烟 / 集成 / secret 扫描），
# 只是改为可复用 + 按调用方决定是否跑集成与镜像构建，避免与 PR/主分支两套逻辑漂移。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr
      run-integration:
        description: "是否运行 Redis/ES/Kafka 集成测试"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gates:
    name: python 3.12 (gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            car-monit-api-python/requirements.txt
            car-monit-api-python/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest (coverage)
        run: python -m pytest -q --cov --cov-report=

      - name: smoke coverage append
        run: python tools/smoke_coverage.py

      - name: coverage gate (business >= 65%)
        run: python -m coverage report --include="app/*,*/com/ruoyi/*" --fail-under=65

      - name: coverage total (informational)
        run: python -m coverage report

      - name: coverage artifacts
        run: |
          python -m coverage html
          python -m coverage xml

      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: car-monit-api-python/coverage/
          retention-days: 14

      - name: check_routes
        run: python tools/check_routes.py

      - name: check_mappers (mapper XML sync)
        run: python tools/check_mappers.py

      - name: check_parity
        run: python tools/check_parity.py

      - name: check_env
        run: python tools/check_env.py

      - name: secret scan (gitleaks-equivalent)
        run: python tools/check_secrets.py

      - name: smoke_test
        run: python scripts/smoke_test.py

      - name: smoke_all_routes
        run: python tools/smoke_all_routes.py

  integration:
    # 真实中间件集成测试（Redis/ES/Kafka service containers；DB 需自备，默认跳过）。
    # 镜像/端口/健康检查与 car-monit-api-python/docker-compose.integration.yml 对齐
    # （见 docs/LOCAL-ENV.md §4）。集成 job 是门禁，不允许 continue-on-error 掩盖红灯。
    if: inputs.run-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      elasticsearch:
        image: elasticsearch:7.17.13
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        options: >-
          --health-cmd "curl -fs http://localhost:9200"
          --health-interval 15s --health-timeout 10s --health-retries 10
      kafka:
        image: bitnami/kafka:3.7
        ports: ["9092:9092"]
        env:
          KAFKA_CFG_NODE_ID: "0"
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          # 默认 1 分区，保证 key 散列/顺序断言稳定（用例内也会显式建 1 分区主题）
          KAFKA_CFG_NUM_PARTITIONS: "1"
        options: >-
          --health-cmd "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval 15s --health-timeout 10s --health-retries 10
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            car-monit-api-python/requirements.txt
            car-monit-api-python/requirements.lock.txt

      - run: pip install -r requirements.txt

      - name: integration (redis + es + kafka)
        run: python -m pytest tests/business -m integration -q
        env:
          CAR_MONIT_TEST_REDIS: "1"
          CAR_MONIT_REDIS_URL: "redis://127.0.0.1:6379/0"
          CAR_MONIT_TEST_ES: "1"
          CAR_MONIT_ES_URL: "http://127.0.0.1:9200"
          CAR_MONIT_TEST_KAFKA: "1"
          CAR_MONIT_KAFKA_URL: "127.0.0.1:9092"

  docker:
    # 仅构建校验，不推送：镜像 registry（GHCR / 私有）尚未确认，见 docs/CI-CD-PIPELINES.md §3。
    name: python image build (no push)
    if: inputs.mode != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t car-monit-api-python:${{ github.sha }} .

      - name: 导出镜像（仅 release，便于下载）
        if: inputs.mode == 'release'
        run: docker save car-monit-api-python:${{ github.sha }} | gzip > car-monit-api-python-image.tar.gz

      - name: 上传镜像包
        if: inputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: python-image-${{ github.sha }}
          path: car-monit-api-python/car-monit-api-python-image.tar.gz
          if-no-files-found: error
          retention-days: 14
