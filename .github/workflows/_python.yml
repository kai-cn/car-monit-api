name: _python

# 可复用 workflow：Python 3.12 迁移实现。
# 门禁内容原样承自旧 .github/workflows/ci.yml（覆盖率 65% / check_* / 冒烟 / 集成 / secret 扫描），
# 只是改为可复用 + 按调用方决定是否跑集成与镜像构建，避免与 PR/主分支两套逻辑漂移。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr
      run-integration:
        description: "是否运行 Redis/ES/Kafka 集成测试"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gates:
    name: python 3.12 (gates / openEuler)
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 45
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - name: 安装基础工具 + 从源码编译 Python 3.12（openEuler dnf）
        shell: bash
        # checkout 前语言目录尚不存在，必须显式回到 workspace 根。
        working-directory: .
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 git tar gzip curl ca-certificates \
            gcc gcc-c++ make openssl-devel libffi-devel bzip2-devel zlib-devel xz-devel sqlite-devel
          # setup-python 的 standalone Python 在 openEuler 上 ssl 模块不可用（pip 无法走 HTTPS），
          # 改为源码编译并显式链接 openssl，确保 ssl 模块可用。
          curl -fsSL https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tgz -o /tmp/py.tgz
          tar -xzf /tmp/py.tgz -C /tmp
          cd /tmp/Python-3.12.10
          ./configure --prefix=/usr/local --with-ensurepip=install --quiet
          make -j"$(nproc)" --quiet
          make install --quiet
          ln -sf /usr/local/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/local/bin/python3.12 /usr/local/bin/python
          python3 -c "import ssl; print('ssl OK', ssl.OPENSSL_VERSION)"

      - uses: actions/checkout@v4

      # 不用 setup-python 的 cache: pip —— 它会调用 lsb_release，openEuler 镜像没有该命令。
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('car-monit-api-python/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # Python 3.12 已在上面源码编译安装到 /usr/local，不再用 setup-python（其 standalone 构建缺 ssl）。

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: pytest (coverage)
        run: python -m pytest -q --cov --cov-report=

      - name: smoke coverage append
        run: python tools/smoke_coverage.py

      - name: coverage gate (business >= 65%)
        run: python -m coverage report --include="app/*,*/com/ruoyi/*" --fail-under=65

      - name: coverage total (informational)
        run: python -m coverage report

      - name: coverage artifacts
        run: |
          python -m coverage html
          python -m coverage xml

      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: car-monit-api-python/coverage/
          retention-days: 14

      - name: check_routes
        run: python tools/check_routes.py

      - name: check_mappers (mapper XML sync)
        run: python tools/check_mappers.py

      - name: check_parity
        run: python tools/check_parity.py

      - name: check_env
        run: python tools/check_env.py

      - name: secret scan (gitleaks-equivalent)
        run: python tools/check_secrets.py

      - name: smoke_test
        run: python scripts/smoke_test.py

      - name: smoke_all_routes
        run: python tools/smoke_all_routes.py

  integration:
    # 真实中间件集成测试（Redis/ES/Kafka service containers；DB 需自备，默认跳过）。
    # 容器 job：service containers 与 job 容器在同一 Docker 网络，按服务名访问
    # （redis / elasticsearch / kafka），不能用 127.0.0.1；Kafka advertised listener 同步改为 kafka:9092。
    name: python 3.12 (integration / openEuler)
    if: inputs.run-integration
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      elasticsearch:
        image: elasticsearch:7.17.13
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        options: >-
          --health-cmd "curl -fs http://localhost:9200"
          --health-interval 15s --health-timeout 10s --health-retries 10
      kafka:
        # Bitnami 免费镜像在 2025 年后陆续下架/迁移，改用 Apache 官方镜像（KRaft 单节点）。
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          # 默认 1 分区，保证 key 散列/顺序断言稳定（用例内也会显式建 1 分区主题）
          KAFKA_NUM_PARTITIONS: "1"
        options: >-
          --health-cmd "sh -c '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list'"
          --health-interval 15s --health-timeout 10s --health-retries 10
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - name: 安装基础工具 + 从源码编译 Python 3.12（openEuler dnf）
        shell: bash
        # checkout 前语言目录尚不存在，必须显式回到 workspace 根。
        working-directory: .
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 git tar gzip curl ca-certificates \
            gcc gcc-c++ make openssl-devel libffi-devel bzip2-devel zlib-devel xz-devel sqlite-devel
          curl -fsSL https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tgz -o /tmp/py.tgz
          tar -xzf /tmp/py.tgz -C /tmp
          cd /tmp/Python-3.12.10
          ./configure --prefix=/usr/local --with-ensurepip=install --quiet
          make -j"$(nproc)" --quiet
          make install --quiet
          ln -sf /usr/local/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/local/bin/python3.12 /usr/local/bin/python
          python3 -c "import ssl; print('ssl OK', ssl.OPENSSL_VERSION)"

      - uses: actions/checkout@v4

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('car-monit-api-python/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # Python 3.12 已在上面源码编译安装到 /usr/local，不再用 setup-python。

      - run: python -m pip install -r requirements.txt

      - name: integration (redis + es + kafka)
        run: python -m pytest tests/business -m integration -q
        env:
          CAR_MONIT_TEST_REDIS: "1"
          CAR_MONIT_REDIS_URL: "redis://redis:6379/0"
          CAR_MONIT_TEST_ES: "1"
          CAR_MONIT_ES_URL: "http://elasticsearch:9200"
          CAR_MONIT_TEST_KAFKA: "1"
          CAR_MONIT_KAFKA_URL: "kafka:9092"

  docker:
    # Docker 镜像构建需要宿主 Docker daemon；GitHub 的容器 job 不提供 DinD，
    # 因此该 job 保留在 ubuntu-latest（唯一无法容器化的 CI 环节，见 docs/CI-OPENEULER.md）。
    name: python image build (no push)
    if: inputs.mode != 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: car-monit-api-python
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t car-monit-api-python:${{ github.sha }} .

      - name: 导出镜像（仅 release，便于下载）
        if: inputs.mode == 'release'
        run: docker save car-monit-api-python:${{ github.sha }} | gzip > car-monit-api-python-image.tar.gz

      - name: 上传镜像包
        if: inputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: python-image-${{ github.sha }}
          path: car-monit-api-python/car-monit-api-python-image.tar.gz
          if-no-files-found: error
          retention-days: 14
