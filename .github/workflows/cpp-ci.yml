name: C++ CI

on:
  push:
    branches: [car-monit-api-cpp]
    paths:
      - 'car-monit-api-cpp/**'
      - '.github/workflows/cpp-ci.yml'
  pull_request:
    paths:
      - 'car-monit-api-cpp/**'
      - '.github/workflows/cpp-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: car-monit-api-cpp

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # Windows + MSVC：与本地开发链路一致（CMake + Ninja，/W4 + /WX）。
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # CMake 的 Ninja 生成器需要 cl.exe/INCLUDE/LIB 已注入当前 shell；
      # GitHub runner 默认不加载 VS 开发环境，必须显式初始化。
      - name: 配置 MSVC 开发环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 缓存 librdkafka（FetchContent）
        uses: actions/cache@v4
        with:
          path: car-monit-api-cpp/build/_deps
          key: rdkafka-${{ runner.os }}-${{ hashFiles('car-monit-api-cpp/CMakeLists.txt') }}

      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCM_WERROR=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        run: ctest --test-dir build --output-on-failure

  # Linux GCC / Clang：把此前“已修但未验证”的 POSIX 分支放到真实 Linux 上跑。
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpq-dev libssl-dev

      - name: 配置 + 构建 + 测试（scripts/ci-linux.sh）
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BUILD_DIR: build-linux-${{ matrix.name }}
        run: bash scripts/ci-linux.sh

  # ASan/UBSan：本机（Windows/MSVC、无 WSL/Docker）无法验证，由该 job 承担。
  linux-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpq-dev libssl-dev

      - name: ASan + UBSan 构建与测试
        env:
          CC: clang
          CXX: clang++
          BUILD_DIR: build-linux-asan
        run: bash scripts/ci-linux.sh -DCMAKE_BUILD_TYPE=Debug -DCM_SANITIZE=address,undefined

  # 静态分析 + 格式检查。
  # - cppcheck 阻断（只开 warning/performance/portability，排除 third_party）。
  # - clang-format 目前为“建议”阶段：仓库尚未整体格式化，阻断会造成全仓 diff 爆炸；
  #   脚本只检查相对基线的变更文件，等逐步格式化后再改为阻断（见 docs/DECISIONS.md D-006）。
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装工具
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-format

      - name: cppcheck
        run: >
          cppcheck --enable=warning,performance,portability --std=c++20
          --inline-suppr --suppress=missingIncludeSystem
          --suppress=*:*third_party*
          --error-exitcode=1
          -I src -I third_party -I third_party/httplib -I third_party/nlohmann
          -i third_party
          src tests

      - name: clang-format（增量检查，建议阶段）
        continue-on-error: true
        run: bash scripts/format-check.sh
