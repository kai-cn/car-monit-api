# ============================================================================
# 文件：.github/workflows/master.yml
# 用途：主分支 push 总入口：编排各语言 job 与 parity 门禁
# 触发：手动 dispatch / push 事件
# 主要 job：presence、java、cpp、go、python、rust、image-java、image-python、image-go、image-cpp、image-rust、master-gate
# 说明：本文件仅新增中文注释，不改动任何执行逻辑；runner/权限/守卫以实际配置为准。
# ============================================================================
name: master

# 主分支流水线：push 到 master 全量构建（不做路径分诊），产出可归档制品。
# 默认分支口径统一为 master；不要加入 main 兼容分支。
# V3 分支适配：push 到 car-monit-api-java-V3 也触发本流水线；PR 基线仍为 master。
# 同一 ref 不取消进行中的运行：每次提交都要留下完整的构建/测试结论。
on:
  push:
    branches: ["master", "car-monit-api-java-V3"]
  workflow_dispatch:

concurrency:
  group: master-${{ github.ref }}
  # Perf: cancel superseded runs so the queue always serves the newest commit.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # rust 目录被 .gitignore L77 忽略；C++ 完整源码在 car-monit-api-cpp 分支，
  # master 只有 11 个文件。先探测存在性，避免调用必然失败的 job。
  # ── job: presence ──
  presence:
    name: presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      cpp: ${{ steps.check.outputs.cpp }}
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4
      - name: 检查 rust / cpp 源码是否已入库
        id: check
        shell: bash
        run: |
          if [ -d car-monit-api-rust ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::car-monit-api-rust 未入库（.gitignore L77），跳过 Rust 流水线"
          fi
          if [ -f car-monit-api-cpp/src/main.cpp ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master 缺少 C++ 入口 src/main.cpp（完整源码在 car-monit-api-cpp 分支），跳过 C++ 流水线"
          fi

  # ── job: java ──
  java:
    name: java
    uses: ./.github/workflows/_java.yml
    with:
      mode: master
      jdk-version: "25"

  # ── job: cpp ──
  cpp:
    name: cpp
    needs: presence
    if: needs.presence.outputs.cpp == 'true'
    uses: ./.github/workflows/_cpp.yml
    with:
      mode: master

  # ── job: go ──
  go:
    name: go
    uses: ./.github/workflows/_go.yml
    with:
      mode: master

  # ── job: python ──
  python:
    name: python
    uses: ./.github/workflows/_python.yml
    with:
      mode: master
      run-integration: true

  # ── job: rust ──
  rust:
    name: rust
    needs: presence
    if: needs.presence.outputs.rust == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      mode: master

  # ---- 镜像构建 + GHCR 推送（master 上额外产出 latest 标签）----
  # ── job: image-java ──
  image-java:
    name: image java
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: read
      packages: write
    with:
      language: java
      push: true

  # ── job: image-python ──
  image-python:
    name: image python
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: read
      packages: write
    with:
      language: python
      push: true

  # ── job: image-go ──
  image-go:
    name: image go
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: read
      packages: write
    with:
      language: go
      push: true

  # ── job: image-cpp ──
  image-cpp:
    name: image cpp
    needs: presence
    if: needs.presence.outputs.cpp == 'true'
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: read
      packages: write
    with:
      language: cpp
      push: true

  # ── job: image-rust ──
  image-rust:
    name: image rust
    needs: presence
    if: needs.presence.outputs.rust == 'true'
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: read
      packages: write
    with:
      language: rust
      push: true

  # ── job: master-gate ──
  master-gate:
    name: Master Gate
    if: always()
    needs: [presence, java, cpp, go, python, rust, image-java, image-python, image-go, image-cpp, image-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总各语言结果
        shell: bash
        run: |
          echo "job results: ${{ join(needs.*.result, ', ') }}"

      - name: 失败/取消则阻断
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: |
          echo "::error::主分支流水线存在失败或被取消的 job"
          exit 1
