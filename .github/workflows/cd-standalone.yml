# ============================================================================
# 文件：.github/workflows/cd-standalone.yml
# 用途：单机部署：打包 standalone 产物并上传 Release
# 触发：手动 dispatch / push 事件
# 主要 job：build、verify
# 说明：跨分支构建 rust/cpp（完整源码分别在 car-monit-api-rust / car-monit-api-cpp 分支）；
#       csharp/kotlin 仅有迁移提示文档、无源码，不纳入制品（见 verify notice）。
# ============================================================================
name: cd-standalone

# 单机部署 CD：构建离线 tar.gz 制品（jar / Go 二进制 / Python 源码+离线 wheels /
# Rust 二进制 / C++ 二进制 / systemd unit / 参数化 install.sh、uninstall.sh / SHA256SUMS），
# 并在全新 runner 上做完整生命周期验证：解包→校验和→install→启动→/health→stop→uninstall→断言清理。
# 与 K8s 的 deploy.yml 互不影响。
#
# 语言源码分布（2026-11-19 实测）：
#   java / go / python —— 本分支（master）内完整源码
#   rust                —— car-monit-api-rust 分支（191 文件，Cargo.toml + Cargo.lock）
#   cpp                 —— car-monit-api-cpp 分支（103 文件，CMakeLists.txt + src + tests）
#   csharp / kotlin     —— 仅 java-to-*-migration-prompt.md，无源码，跳过
# rust/cpp 用 actions/checkout(ref=...) 拉到独立子目录构建，不合并源码、不污染本分支。

on:
  workflow_dispatch:
    inputs:
      service:
        description: "打包哪个实现（csharp/kotlin 无源码，不可选）"
        required: true
        type: choice
        default: all
        options: [all, java, go, python, rust, cpp]
      tag:
        description: "可选：把制品附加到已存在的 Release tag（留空则仅构建）"
        required: false
        type: string
        default: ""
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # ── job: build ──
  build:
    name: build standalone artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # tag 推送时 gh release upload 需要
    steps:
      # 拉取本分支源码（java/go/python/deploy 模板）
      - uses: actions/checkout@v4

      # 跨分支拉取 rust/cpp 完整源码到独立子目录（不影响本分支工作区）
      # push 事件下 inputs.service 为空 → 表达式为真 → 仍拉取（all 语义）
      - name: Checkout rust source (car-monit-api-rust)
        if: inputs.service == '' || inputs.service == 'all' || inputs.service == 'rust'
        uses: actions/checkout@v4
        with:
          ref: car-monit-api-rust
          path: src-rust
      - name: Checkout cpp source (car-monit-api-cpp)
        if: inputs.service == '' || inputs.service == 'all' || inputs.service == 'cpp'
        uses: actions/checkout@v4
        with:
          ref: car-monit-api-cpp
          path: src-cpp

      # 安装 JDK
      - uses: actions/setup-java@v4
        # Perf: let setup-java restore Maven dependencies from the action cache.
        # Perf: Maven dependency cache; key follows pom.xml changes.
        with:
          cache: maven
          distribution: temurin
          java-version: "8"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      # 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rust 1.90.0（与 rust-toolchain.toml 一致）
      - name: 安装 Rust 1.90.0
        if: inputs.service == '' || inputs.service == 'all' || inputs.service == 'rust'
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      # 原生构建系统依赖（rust 的 rdkafka-sys cmake-build 与 cpp 都需要）
      # 关键：librdkafka 启用 curl 支持，缺 libcurl4-openssl-dev 会报 fatal error: curl/curl.h
      - name: 安装原生构建依赖（Rust/C++）
        if: inputs.service == '' || inputs.service == 'all' || inputs.service == 'rust' || inputs.service == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libpq-dev libssl-dev zlib1g-dev libcurl4-openssl-dev

      - name: 构建各语言产物并组装
        shell: bash
        env:
          SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          want() { [ "$SERVICE" = "all" ] || [[ ",$SERVICE," == *",$1,"* ]]; }
          DIST="$GITHUB_WORKSPACE/dist/standalone"
          mkdir -p "$DIST"

          if want java; then
            mvn -B -ntp -DskipTests package
            mkdir -p "$DIST/payloads/java"
            cp pro-business-api/target/pro-business-api-1.0.jar "$DIST/payloads/java/app.jar"
          fi

          if want go; then
            mkdir -p "$DIST/payloads/go"
            ( cd car-monit-api-go && \
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS=-buildvcs=false \
              go build -trimpath -ldflags "-s -w" -o "$DIST/payloads/go/api" ./cmd/api )
          fi

          if want python; then
            mkdir -p "$DIST/payloads/python/wheels"
            cp -r car-monit-api-python/app car-monit-api-python/com car-monit-api-python/java \
                  car-monit-api-python/javax car-monit-api-python/org \
                  car-monit-api-python/pro-base-common car-monit-api-python/pro-business-api \
                  car-monit-api-python/run.py car-monit-api-python/bootstrap.py \
                  car-monit-api-python/requirements.txt car-monit-api-python/requirements.lock.txt \
                  "$DIST/payloads/python/"
            python -m pip download --only-binary=:all: \
              -r car-monit-api-python/requirements.lock.txt \
              -d "$DIST/payloads/python/wheels"
          fi

          if want rust; then
            # 完整源码在 car-monit-api-rust 分支，已由上面 checkout 到 src-rust
            [ -d src-rust/car-monit-api-rust ] || { echo "::error::rust 源码目录 src-rust/car-monit-api-rust 缺失"; exit 1; }
            ( cd src-rust/car-monit-api-rust && \
              cargo build --release --locked && \
              mkdir -p "$DIST/payloads/rust/config" && \
              cp target/release/car-monit-api-rust "$DIST/payloads/rust/" && \
              sed -E 's#192\.168\.56\.10#<DB_HOST>#g' config/application.yaml > "$DIST/payloads/rust/config/application.yaml" )
          fi

          if want cpp; then
            # 完整源码在 car-monit-api-cpp 分支，已由上面 checkout 到 src-cpp；
            # 必须用 CM_WITH_KAFKA=ON（CI 默认路径）；OFF 路径源码有条件编译 bug。
            [ -d src-cpp/car-monit-api-cpp ] || { echo "::error::cpp 源码目录 src-cpp/car-monit-api-cpp 缺失"; exit 1; }
            ( cd src-cpp/car-monit-api-cpp && \
              cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCM_WITH_KAFKA=ON && \
              cmake --build build-release --parallel && \
              mkdir -p "$DIST/payloads/cpp/configs" && \
              cp build-release/car-monit-api "$DIST/payloads/cpp/" && \
              sed -E 's#192\.168\.56\.10#<DB_HOST>#g' configs/config.yaml > "$DIST/payloads/cpp/configs/config.yaml" )
          fi

          echo "::notice::csharp / kotlin 仅有迁移提示文档，无源码，未纳入制品"

          cp -r deploy/standalone/systemd deploy/standalone/config \
                deploy/standalone/install.sh deploy/standalone/uninstall.sh \
                deploy/standalone/README.md "$DIST/"

          ( cd "$DIST" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )

          ARCHIVE="car-monit-api-standalone-${GITHUB_SHA:0:7}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$ARCHIVE" -C "$DIST" .
          ls -lh "$GITHUB_WORKSPACE/$ARCHIVE"

      - name: 上传单机 artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tar-${{ github.sha }}
          path: car-monit-api-standalone-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: 附加到 GitHub Release（tag/dispatch 指定 tag）
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" car-monit-api-standalone-*.tar.gz --clobber

  # ── job: verify ──
  verify:
    name: verify standalone lifecycle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # push 或 dispatch=all 时要求 rust/cpp payload 必须存在（注意 && 优先于 ||，必须加括号）
      SERVICE_ALL: ${{ (inputs.service == '' || inputs.service == 'all') && '1' || '0' }}
    steps:
      # 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 下载上游 workflow 产物
      - uses: actions/download-artifact@v4
        with:
          name: standalone-tar-${{ github.sha }}
          path: downloaded

      - name: 解包、校验和、内容清单
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          tar -xzf downloaded/car-monit-api-standalone-*.tar.gz -C verify
          cd verify
          sha256sum -c SHA256SUMS
          tar -tzf ../downloaded/car-monit-api-standalone-*.tar.gz > /tmp/tar-list.txt
          for entry in \
            ./install.sh ./uninstall.sh ./README.md ./SHA256SUMS \
            ./systemd/car-monit-api-python.service \
            ./config/python.env.example; do
            grep -qxF "$entry" /tmp/tar-list.txt || { echo "::error::tar 缺少 $entry"; exit 1; }
          done
          if [ -d ./payloads/python ]; then
            grep -qxF './payloads/python/run.py' /tmp/tar-list.txt || { echo "::error::tar 缺少 python/run.py"; exit 1; }
            grep -qE '^\./payloads/python/wheels/' /tmp/tar-list.txt || { echo "::error::tar 缺少 python/wheels"; exit 1; }
          fi
          # 各语言制品存在性与清单核对
          check_payload() {
            local svc="$1" bin="$2"
            if [ -f "./payloads/$svc/$bin" ]; then
              grep -qxF "./payloads/$svc/$bin" /tmp/tar-list.txt || { echo "::error::tar 缺少 $svc/$bin"; exit 1; }
              echo "payload $svc/$bin OK ($(stat -c%s "./payloads/$svc/$bin") bytes)"
            else
              echo "::notice::payload $svc/$bin 未构建（service 未选择该语言）"
            fi
          }
          check_payload java app.jar
          check_payload go api
          check_payload rust car-monit-api-rust
          check_payload cpp car-monit-api
          # service=all（含 push）时强制要求 5 种 payload 齐全（缺=构建被跳过，判失败）
          if [ "${SERVICE_ALL:-0}" = "1" ]; then
            for must in java/app.jar go/api python/run.py rust/car-monit-api-rust cpp/car-monit-api; do
              [ -f "./payloads/$must" ] || { echo "::error::service=all 要求 payload $must 存在但缺失"; exit 1; }
            done
          fi
          echo "::notice::csharp / kotlin 无源码，不在制品清单中"

      - name: 完整生命周期演练（Python shim / Rust check-config）
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/verify"
          if [ -d "$ROOT/payloads/python" ]; then SVC=python
          elif [ -d "$ROOT/payloads/java" ]; then SVC=java
          elif [ -d "$ROOT/payloads/go" ]; then SVC=go
          elif [ -d "$ROOT/payloads/rust" ]; then SVC=rust
          elif [ -d "$ROOT/payloads/cpp" ]; then SVC=cpp
          else echo "::error::artifact 中无可用服务"; exit 1; fi
          echo "verify service=$SVC"
          PREFIX="$PWD/lifecycle/opt"; LOGDIR="$PWD/lifecycle/log"; UNITDIR="$PWD/lifecycle/units"
          OUT="$PWD/verify-report.txt"
          {
            echo "service=$SVC"
            echo "artifact=$(ls downloaded/car-monit-api-standalone-*.tar.gz | xargs -n1 basename)"
            echo "artifact_size=$(stat -c%s downloaded/car-monit-api-standalone-*.tar.gz)"
          } > "$OUT"

          bash "$ROOT/install.sh" --prefix "$PREFIX" --log-dir "$LOGDIR" --unit-dir "$UNITDIR" \
            --service "$SVC" --user "$(id -un)" --no-start >> "$OUT" 2>&1

          START_STATUS="000"; BODY=""
          if [ "$SVC" = python ]; then
            CAR_MONIT_RUNTIME=shim CAR_MONIT_PORT=19901 \
              nohup "$PREFIX/python/venv/bin/python" "$PREFIX/python/run.py" \
              > "$LOGDIR/python/stdout.log" 2>&1 &
            PID=$!
            for i in $(seq 1 30); do
              START_STATUS=$(curl -s -o /tmp/health-body -w '%{http_code}' http://127.0.0.1:19901/health || true)
              [ "$START_STATUS" = "200" ] && break
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            BODY="$(cat /tmp/health-body 2>/dev/null || true)"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          elif [ "$SVC" = rust ]; then
            # rust 二进制自带 --check-config，可离线验证可执行性与配置加载
            set +e
            "$PREFIX/rust/car-monit-api-rust" --check-config --config "$PREFIX/rust/config/application.yaml" \
              > "$LOGDIR/rust/check-config.log" 2>&1
            rc=$?
            set -e
            echo "rust --check-config exit=$rc" >> "$OUT"
            cat "$LOGDIR/rust/check-config.log" >> "$OUT" 2>/dev/null || true
            case "$rc" in 0) START_STATUS="CHECK_OK"; BODY="rust config validated";; *) echo "::error::rust --check-config 失败 exit=$rc"; exit 1;; esac
          else
            echo "非 Python/Rust 服务在本 runner 无外部 DB/Redis，按约定记录启动失败" >> "$OUT"
            START_STATUS="000"; BODY="external middleware unavailable"
          fi

          {
            echo "start_http_status=$START_STATUS"
            echo "start_body=$BODY"
            echo "process_log_tail:"
            tail -n 20 "$LOGDIR/$SVC/stdout.log" 2>/dev/null || true
          } >> "$OUT"

          bash "$ROOT/uninstall.sh" --prefix "$PREFIX" --log-dir "$LOGDIR" --unit-dir "$UNITDIR" \
            --service "$SVC" --no-systemctl >> "$OUT" 2>&1

          if [ -d "$PREFIX/$SVC" ] || [ -d "$LOGDIR/$SVC" ] || [ -f "$UNITDIR/car-monit-api-$SVC.service" ]; then
            echo "cleanup=FAILED" >> "$OUT"; echo "::error::uninstall 未清理干净"; exit 1
          fi
          echo "cleanup=OK" >> "$OUT"

          {
            echo "### 单机 artifact 生命周期验证"
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-verify-report-${{ github.sha }}
          path: verify-report.txt
          if-no-files-found: warn
          retention-days: 14
