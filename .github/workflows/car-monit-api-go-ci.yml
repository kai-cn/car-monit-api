name: car-monit-api-go CI

# 报告 02 P0-6 + 本轮收尾：把 gofmt / goimports / vet / build / test / race / govulncheck
# 全部纳入门禁，任一失败即阻断。只对 car-monit-api-go 子目录生效。
#
# 换行口径：Linux runner 以 LF 检出，gofmt/goimports 无假失败；
# 本地 Windows 若 core.autocrlf=true，check.bat 会跳过 gofmt 并以本流水线为准。

on:
  push:
    paths:
      - "car-monit-api-go/**"
      - ".github/workflows/car-monit-api-go-ci.yml"
  pull_request:
    paths:
      - "car-monit-api-go/**"
      - ".github/workflows/car-monit-api-go-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: car-monit-api-go

jobs:
  lint-build-test:
    name: gofmt / goimports / vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: car-monit-api-go/go.mod
          cache-dependency-path: car-monit-api-go/go.sum

      - name: gofmt（只检查，不改写）
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化（本地执行 gofmt -w 修复）："
            echo "$out"
            exit 1
          fi

      - name: goimports（import 分组/未使用 import）
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.30.0
          out=$(goimports -l cmd internal)
          if [ -n "$out" ]; then
            echo "::error::以下文件 import 未整理（本地执行 goimports -w 修复）："
            echo "$out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1       

  race:
    name: go test -race（并发关键路径）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: car-monit-api-go/go.mod
          cache-dependency-path: car-monit-api-go/go.sum

      # race detector 需要 cgo；ubuntu-latest 自带 gcc。
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1

  govulncheck:
    name: govulncheck（依赖安全）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: car-monit-api-go/go.mod
          cache-dependency-path: car-monit-api-go/go.sum

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 扫描（发现可达漏洞即失败）
        run: govulncheck ./...
