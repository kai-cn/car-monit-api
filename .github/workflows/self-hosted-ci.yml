name: self-hosted-ci

# 账号级 GitHub-hosted runner 因账单/支出限额不可用时，api V3 分支的可用 CI/CD 入口。
# 运行在本机 WSL2 openEuler 自托管 runner（label: wsl-k3s-api），集群为 k3d 一主两从。
on:
  workflow_dispatch:
  push:
    branches:
      - car-monit-api-java-V3
      - car-monit-api-jdk21
    paths:
      - .github/workflows/self-hosted-ci.yml
      - pom.xml
      - pro-business-api/**
      - pro-base-common/**
      - docker/java.Dockerfile
      - deploy/standalone/**
      - .github/workflows/**

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx768m

jobs:
  build:
    name: compile-and-test
    runs-on: [self-hosted, linux, x64, wsl-k3s-api]
    timeout-minutes: 45
    steps:
      - name: Runner environment
        run: |
          set +e
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          uname -a
          echo "cpus=$(nproc)"
          free -m | head -2
          echo "node=$(node -v 2>&1)  user=$(id -un)  HOME=${HOME}"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          command -v java && java -version 2>&1 | head -3
          command -v mvn && mvn -v 2>&1 | head -3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (pinned Temurin 21.0.13+9, self-hosted)
        shell: bash
        run: |
          set -euo pipefail
          JDK_MAJOR="21"
          JDK_FULL="21.0.13+9"
          JDK_TARBALL="OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz"
          GH_TAG="jdk-21.0.13%2B9"
          CACHE_ROOT="${HOME}/.cache/ci-toolchain"
          JDK_HOME="${CACHE_ROOT}/jdk-${JDK_FULL}"

          if [ -x "${JDK_HOME}/bin/java" ]; then
            echo ">> reuse cached JDK ${JDK_FULL} at ${JDK_HOME}"
          else
            mkdir -p "${CACHE_ROOT}"
            TGZ="${CACHE_ROOT}/${JDK_TARBALL}.part"
            urls=(
              "https://mirrors.tuna.tsinghua.edu.cn/Adoptium/${JDK_MAJOR}/jdk/x64/linux/${JDK_TARBALL}"
              "https://github.com/adoptium/temurin${JDK_MAJOR}-binaries/releases/download/${GH_TAG}/${JDK_TARBALL}"
            )
            ok=0
            for u in "${urls[@]}"; do
              echo ">> fetching ${u}"
              if curl -fsSL --retry 2 --connect-timeout 20 --max-time 900 -o "${TGZ}" "${u}"; then
                ok=1
                break
              fi
              echo ">> mirror unavailable: ${u}" >&2
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::error::unable to download Temurin ${JDK_FULL} from any configured mirror"
              exit 1
            fi
            rm -rf "${JDK_HOME}.tmp"
            mkdir -p "${JDK_HOME}.tmp"
            tar -xzf "${TGZ}" -C "${JDK_HOME}.tmp" --strip-components=1
            rm -f "${TGZ}"
            mv "${JDK_HOME}.tmp" "${JDK_HOME}"
            echo ">> installed JDK ${JDK_FULL} at ${JDK_HOME}"
          fi

          echo "JAVA_HOME=${JDK_HOME}" >> "${GITHUB_ENV}"
          echo "${JDK_HOME}/bin" >> "${GITHUB_PATH}"
          export JAVA_HOME="${JDK_HOME}"
          export PATH="${JDK_HOME}/bin:${PATH}"
          java -version 2>&1

      - name: Setup Maven 3.9.9 (self-hosted, with system fallback)
        shell: bash
        run: |
          set -euo pipefail
          MVN_VER="3.9.9"
          MVN_TARBALL="apache-maven-${MVN_VER}-bin.tar.gz"
          CACHE_ROOT="${HOME}/.cache/ci-toolchain"
          MVN_HOME="${CACHE_ROOT}/apache-maven-${MVN_VER}"

          if [ -x "${MVN_HOME}/bin/mvn" ]; then
            echo ">> reuse cached Maven ${MVN_VER} at ${MVN_HOME}"
          else
            mkdir -p "${CACHE_ROOT}"
            TGZ="${CACHE_ROOT}/${MVN_TARBALL}.part"
            urls=(
              "https://repo.huaweicloud.com/apache/maven/maven-3/${MVN_VER}/binaries/${MVN_TARBALL}"
              "https://archive.apache.org/dist/maven/maven-3/${MVN_VER}/binaries/${MVN_TARBALL}"
            )
            ok=0
            for u in "${urls[@]}"; do
              echo ">> fetching ${u}"
              if curl -fsSL --retry 2 --connect-timeout 20 --max-time 600 -o "${TGZ}" "${u}"; then
                ok=1
                break
              fi
              echo ">> mirror unavailable: ${u}" >&2
            done
            if [ "${ok}" -eq 1 ]; then
              rm -rf "${MVN_HOME}.tmp"
              mkdir -p "${MVN_HOME}.tmp"
              tar -xzf "${TGZ}" -C "${MVN_HOME}.tmp" --strip-components=1
              rm -f "${TGZ}"
              mv "${MVN_HOME}.tmp" "${MVN_HOME}"
              echo ">> installed Maven ${MVN_VER} at ${MVN_HOME}"
            elif command -v mvn >/dev/null 2>&1; then
              echo "::warning::Maven mirror download failed; falling back to system mvn"
              MVN_HOME=""
            else
              echo "::error::Maven ${MVN_VER} unavailable from mirrors and no system mvn on PATH"
              exit 1
            fi
          fi

          if [ -n "${MVN_HOME}" ]; then
            echo "MAVEN_HOME=${MVN_HOME}" >> "${GITHUB_ENV}"
            echo "M2_HOME=${MVN_HOME}" >> "${GITHUB_ENV}"
            echo "${MVN_HOME}/bin" >> "${GITHUB_PATH}"
            export PATH="${MVN_HOME}/bin:${PATH}"
          fi
          mvn -v

      - name: Assert toolchain matches branch
        run: |
          set -euo pipefail
          JAVA_OUT="$(java -version 2>&1)"
          echo "${JAVA_OUT}"
          mvn -v
          # here-string avoids SIGPIPE false-negatives that ``| grep -q`` triggers under pipefail
          grep -qE 'version "21\.' <<< "${JAVA_OUT}" || {
            echo "::error::branch car-monit-api-jdk21 requires JDK 21, runner java differs"
            exit 1
          }

      - name: Compile V3 api module
        run: mvn -B -q -DskipTests -pl pro-business-api -am compile

      - name: Unit tests
        run: mvn -B -q -DskipTests=false -pl pro-business-api -am test

      - name: Startup prerequisite smoke (add-opens, bytecode, delivery entries)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/AddOpensSmoke.java <<'JAVA_EOF'
          import java.lang.reflect.Method;
          public class AddOpensSmoke {
            public static void main(String[] args) throws Exception {
              Method m = Object.class.getDeclaredMethod("clone");
              m.setAccessible(true);
              System.out.println("add-opens is effective");
            }
          }
          JAVA_EOF
          javac -d /tmp /tmp/AddOpensSmoke.java
          # Orika fails at startup on JDK 17+ without this flag; prove the runner JDK enforces strong encapsulation
          if java -cp /tmp AddOpensSmoke >/dev/null 2>&1; then
            echo "::error::JDK unexpectedly allows Object#clone reflection without --add-opens"
            exit 1
          fi
          java --add-opens=java.base/java.lang=ALL-UNNAMED -cp /tmp AddOpensSmoke
          # regression guard: every delivery entry must carry the required flag
          for f in docker/java.Dockerfile deploy/standalone/config/java.env.example \
                   deploy/standalone/systemd/car-monit-api-java.service deploy/standalone/README.md; do
            grep -q -- '--add-opens=java.base/java.lang=ALL-UNNAMED' "$f" || {
              echo "::error::$f missing --add-opens flag"
              exit 1
            }
          done
          # compiled bytecode must match the branch JDK major version (44 + java.specification.version)
          SPEC=$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ {print $3}')
          CLASS_FILE=$(find pro-business-api/target/classes -name '*.class' -print -quit)
          MAJOR=$(javap -verbose "$CLASS_FILE" | awk '/major version/ {print $3}')
          EXPECTED=$((44 + SPEC))
          echo "java.specification.version=$SPEC class_major=$MAJOR expected=$EXPECTED"
          [ "$MAJOR" = "$EXPECTED" ] || { echo "::error::bytecode $MAJOR does not match JDK $SPEC"; exit 1; }
          echo "startup-prerequisite smoke passed"

  deploy:
    name: deploy-to-k3s
    needs: build
    runs-on: [self-hosted, linux, x64, wsl-k3s-api]
    timeout-minutes: 15
    steps:
      - name: Ensure k3d cluster is running (WSL restart resilience)
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo ">> docker daemon down, attempting to start it"
            sudo -n systemctl start docker 2>/dev/null || true
            for i in $(seq 1 12); do
              docker info >/dev/null 2>&1 && break
              sleep 5
            done
          fi
          docker info >/dev/null 2>&1 || {
            echo "::error::docker daemon unavailable on the self-hosted runner"
            exit 1
          }
          RUNNING="$(docker ps --format '{{.Names}}' 2>/dev/null || true)"
          PRESENT="$(docker ps -a --format '{{.Names}}' 2>/dev/null || true)"
          for c in k3d-v3-server-0 k3d-v3-agent-0 k3d-v3-agent-1; do
            if grep -Fxq -- "${c}" <<< "${RUNNING}"; then
              echo "${c}: already running"
            elif grep -Fxq -- "${c}" <<< "${PRESENT}"; then
              echo "${c}: starting"
              docker start "${c}" || true
            else
              echo "::warning::${c}: container not found (cluster may need recreation)"
            fi
          done
          for i in $(seq 1 24); do
            if docker exec k3d-v3-server-0 kubectl get nodes >/dev/null 2>&1; then
              echo "k3d cluster API ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::k3d cluster API did not become ready within 120s"
          exit 1

      - name: Verify cluster (1 control-plane + 2 agents)
        run: docker exec k3d-v3-server-0 kubectl get nodes

      - name: Roll out demo workload on 3 nodes
        run: |
          docker exec k3d-v3-server-0 kubectl create deployment v3-api-ci-probe \
            --image=rancher/mirrored-pause:3.6 --replicas=3 \
            --dry-run=client -o yaml | docker exec -i k3d-v3-server-0 kubectl apply -f -
          docker exec k3d-v3-server-0 kubectl rollout status deployment/v3-api-ci-probe --timeout=240s
          docker exec k3d-v3-server-0 kubectl get pods -l app=v3-api-ci-probe -o wide
