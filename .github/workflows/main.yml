name: main

# 主分支流水线：push 到 master 全量构建（不做路径分诊），产出可归档制品。
# 同一 ref 不取消进行中的运行：每次提交都要留下完整的构建/测试结论。
on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # rust 目录仍被 .gitignore L77 忽略、未入库；先探测存在性，避免调用必然失败的 job。
  presence:
    name: presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查 car-monit-api-rust 是否已入库
        id: check
        shell: bash
        run: |
          if [ -d car-monit-api-rust ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::car-monit-api-rust 未入库（.gitignore L77），跳过 Rust 流水线"
          fi

  java:
    name: java
    uses: ./.github/workflows/_java.yml
    with:
      mode: main
      jdk-version: "8"

  cpp:
    name: cpp
    uses: ./.github/workflows/_cpp.yml
    with:
      mode: main

  go:
    name: go
    uses: ./.github/workflows/_go.yml
    with:
      mode: main

  python:
    name: python
    uses: ./.github/workflows/_python.yml
    with:
      mode: main
      run-integration: true

  rust:
    name: rust
    needs: presence
    if: needs.presence.outputs.rust == 'true'
    uses: ./.github/workflows/_rust.yml
    with:
      mode: main

  main-gate:
    name: Main Gate
    if: always()
    needs: [presence, java, cpp, go, python, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总各语言结果
        shell: bash
        run: |
          echo "job results: ${{ join(needs.*.result, ', ') }}"

      - name: 失败/取消则阻断
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: |
          echo "::error::主分支流水线存在失败或被取消的 job"
          exit 1
