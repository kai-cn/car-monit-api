# ============================================================================
# 文件：.github/workflows/deploy.yml
# 用途：部署 workflow：k3d 集群/单机部署入口
# 触发：手动 dispatch
# 主要 job：precheck、image、deploy
# 说明：本文件仅新增中文注释，不改动任何执行逻辑；runner/权限/守卫以实际配置为准。
# ============================================================================
name: deploy

# CD：构建并推送所选语言的镜像到 GHCR，然后对**已存在**的 K8s Deployment 执行
# kubectl set image + kubectl rollout status。
#
# 例外：本 workflow 为手工 K8s 发布编排，使用 kubectl/gh 等工具，保留 ubuntu 宿主；
# 语言构建/测试已在 openEuler 容器中执行（见 docs/CI-OPENEULER.md）。
# 前置（GitHub 仓库 / Environment 配置，全部无默认值，缺一即显式失败）：
#   vars.K8S_NAMESPACE         目标命名空间
#   vars.K8S_DEPLOYMENT        已存在的 Deployment 名
#   vars.K8S_CONTAINER         Pod 模板中的容器名
#   vars.K8S_IMAGE_PULL_SECRET 已存在的 imagePullSecret 名（私有 GHCR 必需）
#   secrets.KUBE_CONFIG        kubeconfig（建议 base64；脚本兼容明文）
#
# 仓库内没有任何 K8s manifest：本 workflow 只更新已有 Deployment 的镜像。
# 首次部署需人工 bootstrap（namespace / Deployment / imagePullSecret / 配置挂载），
# 详见 docs/CI-CD-PIPELINES.md §10。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "目标环境（GitHub Environment，用于审批与变量隔离）"
        required: true
        type: choice
        default: staging
        options: [staging, production]
      language:
        description: "要部署的实现"
        required: true
        type: choice
        default: java
        options: [java, python, go, cpp, rust]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ── job: precheck ──
  precheck:
    name: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 必须挂 environment：K8S_* variables 可能配置在 environment 作用域。
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      tag: ${{ steps.resolve.outputs.tag }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      deployment: ${{ steps.resolve.outputs.deployment }}
      container: ${{ steps.resolve.outputs.container }}
      pull-secret: ${{ steps.resolve.outputs.pull_secret }}
    steps:
      # 拉取仓库源码
      - uses: actions/checkout@v4

      - name: 前置校验（vars/secrets 缺失即失败）
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
          K8S_IMAGE_PULL_SECRET: ${{ vars.K8S_IMAGE_PULL_SECRET }}
        run: |
          missing=()
          [ -n "$KUBE_CONFIG" ] || missing+=("secrets.KUBE_CONFIG")
          [ -n "$K8S_NAMESPACE" ] || missing+=("vars.K8S_NAMESPACE")
          [ -n "$K8S_DEPLOYMENT" ] || missing+=("vars.K8S_DEPLOYMENT")
          [ -n "$K8S_CONTAINER" ] || missing+=("vars.K8S_CONTAINER")
          [ -n "$K8S_IMAGE_PULL_SECRET" ] || missing+=("vars.K8S_IMAGE_PULL_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::缺少必需配置: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: 解析镜像与部署目标
        id: resolve
        shell: bash
        env:
          LANG_INPUT: ${{ inputs.language }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
          K8S_IMAGE_PULL_SECRET: ${{ vars.K8S_IMAGE_PULL_SECRET }}
        run: |
          case "$LANG_INPUT" in
            java)   name="car-monit-api" ;;
            python) name="car-monit-api-python" ;;
            go)     name="car-monit-api-go" ;;
            cpp)    name="car-monit-api-cpp" ;;
            rust)   name="car-monit-api-rust" ;;
            *) echo "::error::未知语言: $LANG_INPUT"; exit 1 ;;
          esac

          # 固定使用本次提交的短哈希标签，保证部署到可追溯的镜像
          tag="sha-${GITHUB_SHA::7}"

          {
            echo "image=${REGISTRY}/${{ github.repository_owner }}/${name}:${tag}"
            echo "tag=${tag}"
            echo "namespace=${K8S_NAMESPACE}"
            echo "deployment=${K8S_DEPLOYMENT}"
            echo "container=${K8S_CONTAINER}"
            echo "pull_secret=${K8S_IMAGE_PULL_SECRET}"
          } >> "$GITHUB_OUTPUT"

  # ── job: image ──
  image:
    name: image ${{ inputs.language }}
    needs: precheck
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      language: ${{ inputs.language }}
      push: true

  # ── job: deploy ──
  deploy:
    name: deploy to ${{ inputs.environment }}
    needs: [precheck, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: 写入 kubeconfig（base64 或明文）
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion'; then
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          elif printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            :
          else
            echo "::error::secrets.KUBE_CONFIG 既不是 kubeconfig 明文（缺 apiVersion），也不是合法 base64"
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"

      - name: 校验 Deployment 与 imagePullSecret
        shell: bash
        env:
          NS: ${{ needs.precheck.outputs.namespace }}
          DEPLOY: ${{ needs.precheck.outputs.deployment }}
          PULL: ${{ needs.precheck.outputs.pull-secret }}
        run: |
          kubectl -n "$NS" get deployment "$DEPLOY" >/dev/null
          kubectl -n "$NS" get secret "$PULL" >/dev/null

          refs="$(kubectl -n "$NS" get deployment "$DEPLOY" \
            -o jsonpath='{.spec.template.spec.imagePullSecrets[*].name}' | tr ' ' '\n')"
          if ! printf '%s\n' "$refs" | grep -qx "$PULL"; then
            echo "::error::Deployment ${DEPLOY} 的 pod 模板未引用 imagePullSecret ${PULL}，Pod 会 ImagePullBackOff"
            exit 1
          fi

      - name: set image + rollout status
        shell: bash
        env:
          NS: ${{ needs.precheck.outputs.namespace }}
          DEPLOY: ${{ needs.precheck.outputs.deployment }}
          CONTAINER: ${{ needs.precheck.outputs.container }}
          IMAGE: ${{ needs.precheck.outputs.image }}
        run: |
          kubectl -n "$NS" set image "deployment/${DEPLOY}" "${CONTAINER}=${IMAGE}"
          kubectl -n "$NS" rollout status "deployment/${DEPLOY}" --timeout=300s

      - name: 部署摘要
        shell: bash
        run: |
          {
            echo "### 部署完成"
            echo "- environment: ${{ inputs.environment }}"
            echo "- language: ${{ inputs.language }}"
            echo "- image: ${{ needs.precheck.outputs.image }}"
            echo "- deployment: ${{ needs.precheck.outputs.namespace }}/${{ needs.precheck.outputs.deployment }}"
          } >> "$GITHUB_STEP_SUMMARY"
