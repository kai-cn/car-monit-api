name: _java

# 可复用 workflow：Java 主仓库（Spring Boot 2.4.5 / source-target 1.8）。
# 由 pr.yml / master.yml / release.yml 调用，避免三套入口复制检查逻辑。
# 运行环境：openEuler 24.03 容器（GitHub 托管 runner）+ openEuler dnf 的 OpenJDK 8。
#   JDK 发行版差异说明：pom 只要求 source/target=1.8，OpenJDK 8 与 Temurin 8 行为等价；
#   CI 不再使用手写 jdk-version 选择（统一 JDK 8），避免出现"传 21 仍装 8"的假象。
#
# 已知缺口（不在 CI 任务内顺手修）：
#   * pro-base-common / pro-business-api 无 src/test，pom 未配置 checkstyle/spotbugs；
#     因此门禁只到"可编译可打包"。
#   * pulsar-client 2.10.4 在 pom 注释中自述需 JDK 11+，与 JDK 8 目标冲突，未验证。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr
      jdk-version:
        description: "主项目固定 8；未来 Kotlin 等 JVM 模块按自身需要显式传入（21/25），不要共用"
        required: false
        type: string
        default: "8"
      jdk-distribution:
        description: "JDK 发行版"
        required: false
        type: string
        default: temurin

permissions:
  contents: read

jobs:
  build:
    name: java (OpenJDK 8 / openEuler)
    # openEuler 24.03 自带的 java-1.8.0-openjdk-devel 可直接编译 source/target=1.8；
    # 不依赖 Temurin（欧拉仓库无 Temurin）。Maven 走 Apache 官方 tarball（仓库只有 maven-plugin）。
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 45
    steps:
      - name: 安装 JDK8 / Maven / 基础工具（openEuler dnf）
        shell: bash
        working-directory: .
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 java-1.8.0-openjdk-devel tar gzip curl ca-certificates git
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          export JAVA_HOME
          export PATH="/opt/apache-maven-3.9.9/bin:$PATH"
          java -version
          mvn -version

      - uses: actions/checkout@v4

      - name: 缓存 Maven 本地仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 构建（编译 + spring-boot repackage）
        run: mvn -B -ntp -DskipTests clean package

      - name: 门禁口径说明（静态检查缺口）
        if: inputs.mode == 'pr'
        shell: bash
        run: |
          {
            echo "### Java 门禁口径"
            echo "- 模块：pro-base-common / pro-business-api"
            echo "- 已执行：JDK ${{ inputs.jdk-version }} 下 mvn clean package"
            echo "- 未执行：单元测试（无 src/test）、checkstyle/spotbugs（pom 未配置）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 jar
        if: inputs.mode != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: pro-business-api/target/*.jar
          if-no-files-found: error
          retention-days: 14
