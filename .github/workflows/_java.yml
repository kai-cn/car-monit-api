name: _java

# 可复用 workflow：Java 主仓库（Spring Boot 4.1.2 / JDK 25 工具链）。
# 由 pr.yml / master.yml / release.yml 调用，避免三套入口复制检查逻辑。
# 运行环境：openEuler 24.03 容器（GitHub 托管 runner）+ Eclipse Temurin 25 官方 tarball（欧拉仓库无 JDK 25）。
#   jdk-version 输入固定 25，pr/master/release 三个入口必须传入同一值，
#   避免出现「传入 A 却装了 B」的假象。
# 本分支以 JDK 25 作为工具链/运行时，pom 的 java.version / maven.compiler.release = 25（Boot 4.1 的 ASM 支持 major 69）。
#
# 门禁口径：本 workflow 覆盖编译 / 打包；jdk 分支的 self-hosted-ci 另做单测与
# 「启动前置 smoke」（--add-opens 生效性、字节码版本、交付入口参数回归校验）。
# 已知缺口：
#   * pro-base-common / pro-business-api 单测覆盖有限，pom 未配置 checkstyle/spotbugs；
#   * 完整 Spring Boot 启动仍依赖外部 DB/Redis/Kafka，仅在本机实机验收中覆盖，CI 不重复拉起。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr
      jdk-version:
        description: "主项目固定 25；其他 JVM 模块按自身需要显式传入，不要共用"
        required: false
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  build:
    name: java (JDK 25 / openEuler)
    # openEuler 24.03 仓库没有 JDK 25，改用 Eclipse Temurin 官方 tarball；字节码基线由 pom 固定。
    # Maven 走 Apache 官方 tarball（欧拉仓库只有 maven-plugin）。
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 45
    steps:
      - name: 安装 JDK 25 + Maven（openEuler 容器）
        shell: bash
        working-directory: .
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 tar gzip curl ca-certificates git
          curl -fsSL "https://api.adoptium.net/v3/binary/latest/${{ inputs.jdk-version }}/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk25.tgz
          mkdir -p /opt/jdk25
          tar -xzf /tmp/jdk25.tgz -C /opt/jdk25 --strip-components=1
          echo "/opt/jdk25/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=/opt/jdk25" >> "$GITHUB_ENV"
          export JAVA_HOME=/opt/jdk25
          export PATH="/opt/jdk25/bin:$PATH"
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          export PATH="/opt/apache-maven-3.9.9/bin:$PATH"
          # JAVA_HOME 已在上方显式导出（Temurin tarball）
          java -version
          mvn -version

      - name: 校验 JDK 版本与 workflow 入参一致
        run: |
          java -version 2>&1 | grep -q '${{ inputs.jdk-version }}\.' || {
            echo "::error::expected JDK ${{ inputs.jdk-version }}"; exit 1; }

      - uses: actions/checkout@v4

      - name: 缓存 Maven 本地仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 构建（编译 + spring-boot repackage）
        run: mvn -B -ntp -DskipTests clean package

      - name: 门禁口径说明（静态检查缺口）
        if: inputs.mode == 'pr'
        shell: bash
        run: |
          {
            echo "### Java 门禁口径"
            echo "- 模块：pro-base-common / pro-business-api"
            echo "- 已执行：JDK ${{ inputs.jdk-version }} 下 mvn clean package"
            echo "- 未执行：完整单元测试、checkstyle/spotbugs（pom 未配置）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 jar
        if: inputs.mode != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: pro-business-api/target/*.jar
          if-no-files-found: error
          retention-days: 14
