name: _java

# 可复用 workflow：Java 主仓库（Spring Boot 2.7.18 / JDK 17 工具链）。
# 由 pr.yml / master.yml / release.yml 调用，避免三套入口复制检查逻辑。
# 运行环境：openEuler 24.03 容器（GitHub 托管 runner）+ openEuler dnf 的 OpenJDK 17。
#   jdk-version 输入固定 17，pr/master/release 三个入口必须传入同一值，
#   避免出现「传入 A 却装了 B」的假象。
# pom 的 maven.compiler.release=17，必须由 JDK 17+ 编译。
#
# 已知缺口（不在 CI 任务内顺手修）：
#   * pro-base-common / pro-business-api 单测覆盖有限，pom 未配置 checkstyle/spotbugs；
#     因此门禁只到"可编译可打包"。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr
      jdk-version:
        description: "主项目固定 17；其他 JVM 模块按自身需要显式传入，不要共用"
        required: false
        type: string
        default: "17"

permissions:
  contents: read

jobs:
  build:
    name: java (JDK 17 / openEuler)
    # openEuler 24.03 自带的 java-17-openjdk-devel 可编译 release 17；不依赖 Temurin。
    # Maven 走 Apache 官方 tarball（欧拉仓库只有 maven-plugin）。
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 45
    steps:
      - name: 安装 JDK 17 + Maven（openEuler 容器）
        shell: bash
        working-directory: .
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 java-${{ inputs.jdk-version }}-openjdk-devel tar gzip curl ca-certificates git
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          export PATH="/opt/apache-maven-3.9.9/bin:$PATH"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          export JAVA_HOME
          java -version
          mvn -version

      - name: 校验 JDK 版本与 workflow 入参一致
        run: |
          java -version 2>&1 | grep -q '${{ inputs.jdk-version }}\.' || {
            echo "::error::expected JDK ${{ inputs.jdk-version }}"; exit 1; }

      - uses: actions/checkout@v4

      - name: 缓存 Maven 本地仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 构建（编译 + spring-boot repackage）
        run: mvn -B -ntp -DskipTests clean package

      - name: 门禁口径说明（静态检查缺口）
        if: inputs.mode == 'pr'
        shell: bash
        run: |
          {
            echo "### Java 门禁口径"
            echo "- 模块：pro-base-common / pro-business-api"
            echo "- 已执行：JDK ${{ inputs.jdk-version }} 下 mvn clean package"
            echo "- 未执行：完整单元测试、checkstyle/spotbugs（pom 未配置）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 jar
        if: inputs.mode != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ github.sha }}
          path: pro-business-api/target/*.jar
          if-no-files-found: error
          retention-days: 14
