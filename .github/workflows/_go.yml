name: _go

# 可复用 workflow：Go 迁移实现（go.mod 锁 1.24.1，入口 ./cmd/api）。
# Linux runner；本地 Windows 的 tools/check.bat 不在 CI 使用，等价检查在此显式展开。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr

permissions:
  contents: read

jobs:
  checks:
    name: go (1.24.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: car-monit-api-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: car-monit-api-go/go.mod
          cache-dependency-path: car-monit-api-go/go.sum

      - name: gofmt 格式检查
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt（本地执行 gofmt -w 修复）："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet 静态检查
        run: go vet ./...

      - name: go build
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api

      - name: go test（race + 覆盖率）
        env:
          CGO_ENABLED: "1"   # -race 需要 cgo；GitHub runner 自带 gcc
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        shell: bash
        run: |
          {
            echo "### Go 覆盖率"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.sha }}
          path: car-monit-api-go/coverage.out
          retention-days: 14

      - name: 上传二进制（Linux amd64）
        if: inputs.mode != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: go-linux-amd64-${{ github.sha }}
          path: car-monit-api-go/bin/api
          if-no-files-found: error
          retention-days: 14
