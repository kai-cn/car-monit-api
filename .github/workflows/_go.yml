name: _go

# 可复用 workflow：Go 迁移实现（go.mod 锁 1.26.10，入口 ./cmd/api）。
# 运行环境：openEuler 24.03 容器（GitHub 托管 runner）；Go 由 setup-go 安装
# （openEuler 仓库仅 1.21.4，不满足 go.mod 1.26.10）。
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | master | release"
        required: false
        type: string
        default: pr

permissions:
  contents: read

jobs:
  checks:
    name: go (1.26.10 / openEuler)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: openeuler/openeuler:24.03-lts
    timeout-minutes: 20
    defaults:
      run:
        working-directory: car-monit-api-go
    steps:
      - name: 安装基础工具（openEuler dnf）
        shell: bash
        # checkout 前语言目录尚不存在，必须显式回到 workspace 根，不能继承 defaults。
        working-directory: .
        run: |
          dnf install -y git tar gzip unzip curl ca-certificates gcc
          # gcc 供 go test -race 的 cgo 使用；Go 1.26.10 由 setup-go 安装到 tool cache
          # （openEuler 仓库只有 golang 1.21.4，低于 go.mod 要求）。

      - uses: actions/checkout@v4

      - name: Setup Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: car-monit-api-go/go.mod
          cache-dependency-path: car-monit-api-go/go.sum

      - name: gofmt 格式检查
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt（本地执行 gofmt -w 修复）："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet 静态检查
        run: go vet ./...

      - name: go build
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api

      - name: go test（race + 覆盖率）
        env:
          CGO_ENABLED: "1"   # -race 需要 cgo；GitHub runner 自带 gcc
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: govulncheck（可达漏洞门禁）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: 覆盖率摘要
        shell: bash
        run: |
          {
            echo "### Go 覆盖率"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.sha }}
          path: car-monit-api-go/coverage.out
          retention-days: 14

      - name: 上传二进制（Linux amd64）
        if: inputs.mode != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: go-linux-amd64-${{ github.sha }}
          path: car-monit-api-go/bin/api
          if-no-files-found: error
          retention-days: 14
