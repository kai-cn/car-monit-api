# 集成测试用中间件（与 CI integration job 的镜像/端口/环境变量对齐）
#
# 安全约束（见 docs/LOCAL-ENV.md）：
#   1) 只有磁盘满足 C >= 5GB / D >= 8GB 时才允许 `up`；
#   2) 必须显式设置 CAR_MONIT_IT_DATA_DIR，指向剩余空间 >= 8GB 的卷；
#   3) 所有服务限制内存；`down` 不要加 `-v`，避免误删数据。
#
# 用法：
#   $env:CAR_MONIT_IT_DATA_DIR = "E:\car-monit-it-data"
#   docker compose -f docker-compose.integration.yml up -d
#   docker compose -f docker-compose.integration.yml down
#
# 本机 6379/9092 可能已被现有 Redis/Kafka 占用：
#   - 复用现有实例时只起 ES：docker compose up -d elasticsearch
#   - 或改宿主端口：CAR_MONIT_IT_REDIS_PORT=16379 / CAR_MONIT_IT_KAFKA_PORT=19092
#     （测试 URL 需同步指向新端口）
#
# Linux VM 运行并从 Windows 测试时，额外设置：
#   CAR_MONIT_IT_KAFKA_ADVERTISED_HOST=192.168.56.10

name: car-monit-it

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${CAR_MONIT_IT_REDIS_PORT:-6379}:6379"
    volumes:
      - "${CAR_MONIT_IT_DATA_DIR:?set CAR_MONIT_IT_DATA_DIR to a volume with >=8GB free}/redis:/data"
    mem_limit: 256m
    memswap_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:7.17.13
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${CAR_MONIT_IT_ES_PORT:-9200}:9200"
    volumes:
      - "${CAR_MONIT_IT_DATA_DIR:?set CAR_MONIT_IT_DATA_DIR to a volume with >=8GB free}/es:/usr/share/elasticsearch/data"
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${CAR_MONIT_IT_KAFKA_ADVERTISED_HOST:-127.0.0.1}:${CAR_MONIT_IT_KAFKA_PORT:-9092}"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "${CAR_MONIT_IT_KAFKA_PORT:-9092}:9092"
    volumes:
      - "${CAR_MONIT_IT_DATA_DIR:?set CAR_MONIT_IT_DATA_DIR to a volume with >=8GB free}/kafka:/bitnami/kafka"
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
