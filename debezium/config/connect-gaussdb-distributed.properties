# Debezium GaussDB/PostgreSQL Connector 配置文件
# 配置 Debezium 监听 GaussDB 数据库的变更

# 连接器名称（唯一标识）
name=gaussdb-snapshot-flow-connector

# 连接器类（PostgreSQL connector）
connector.class=io.debezium.connector.postgresql.PostgresConnector

# 任务数量（建议与分区数一致）
tasks.max=3

# Kafka Connect 集群配置
kafka.bootstrap.servers=127.0.0.1:9092

# 转换器配置
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=true

# 主题前缀（最终主题名：schema.table，如 jl_data01.ods_rt_szdn_snapshot_flow_addcode）
topic.prefix=gaussdb-cdc

# GaussDB 连接配置
database.hostname=192.168.56.10
database.port=5432
database.user=gaussdb
database.password=${DB_PASSWORD}
database.dbname=RuoYi
database.server.name=jl_data01

# SSL配置（GaussDB 可能需要）
# database.ssl.mode=require

# PostgreSQL 复制槽配置
plugin.name=pgoutput
slot.name=debezium_slot_snapshot_flow

# 发布名称（PostgreSQL 逻辑复制需要）
publication.name=dbz_publication_snapshot_flow

# 捕获的表配置
table.include.list=jl_data01.ods_rt_szdn_snapshot_flow_addcode

# 轮询间隔（捕获变更的频率）
poll.interval.ms=1000

# 快照模式配置
# initial: 首次启动时执行快照
# always: 每次启动都执行快照
# never: 不执行快照，只监听增量
# schema_only: 只捕获结构变化
snapshot.mode=initial

# 快照锁定模式（避免阻塞源表）
snapshot.locking.mode=none

# 快照获取方式
snapshot.fetch.size=10000

# 主题配置
topic.creation.groups=debezium-topics
topic.creation.debezium-topics.partitions=3
topic.creation.debezium-topics.replication.factor=1
topic.creation.debezium-topics.cleanup.policy=delete
topic.creation.debezium-topics.retention.ms=604800000

# 可靠性配置
errors.tolerance=all
errors.deadletterqueue.topic.name=ods-rt-szdn-snapshot-flow-dlq
errors.deadletterqueue.topic.partitions=3
errors.deadletterqueue.context.headers.enable=true

# 增量快照配置（可选，用于大表初始化）
# incremental.snapshot.chunk.size=8096

# 时间戳配置
time.precision.mode=connect

# 截断操作处理
# truncate.handling.mode=rewrite

# 刷新间隔
flush.lsn.enabled=true

# 序列号处理
# sequence.source模式：用于唯一标识变更
# transaction.source.mode：用于区分事务边界
# 不设置时使用默认的lsn模式

# 监控指标
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=true

# 日志级别
log.level=INFO
