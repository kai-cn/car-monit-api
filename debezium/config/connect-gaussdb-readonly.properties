# Debezium GaussDB/PostgreSQL Connector 配置 - 只读模式
# 完全不修改甲方数据库，仅通过逻辑复制监听变更
# 配置说明：
#   - 使用 pgoutput 插件（GaussDB 原生支持）
#   - 不创建任何中间表
#   - 不写入任何数据到源数据库
#   - 通过 SMT 简化消息格式

# 连接器名称（唯一标识）
name=gaussdb-snapshot-flow-connector

# 连接器类（PostgreSQL connector）
connector.class=io.debezium.connector.postgresql.PostgresConnector

# 任务数量（与主题分区数一致）
tasks.max=3

# Kafka Connect 集群配置
kafka.bootstrap.servers=127.0.0.1:9092

# 转换器配置
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# 主题前缀（最终主题名：gaussdb-cdc.jl_data01.ods_rt_szdn_snapshot_flow_addcode）
topic.prefix=gaussdb-cdc

# GaussDB 连接配置（只读连接）
database.hostname=192.168.56.10
database.port=5432
database.user=gaussdb
database.password=${DB_PASSWORD}
database.dbname=RuoYi
database.server.name=jl_data01

# 复制插件（pgoutput 是 GaussDB/PostgreSQL 原生支持的逻辑解码插件）
plugin.name=pgoutput

# 复制槽配置（Debezium 自动创建，无需手动操作）
slot.name=debezium_slot_snapshot_flow
slot.drop.on.stop=false  # 停止时不删除复制槽，避免数据丢失

# 发布配置（需要预先在数据库创建）
publication.name=dbz_publication_snapshot_flow
publication.autocreate.mode=filtered  # 不自动创建发布

# 捕获的表配置（只监听目标表）
table.include.list=jl_data01.ods_rt_szdn_snapshot_flow_addcode

# 轮询间隔（捕获变更的频率，毫秒）
poll.interval.ms=1000

# 快照模式配置
# initial: 首次启动执行快照（读取现有数据），之后监听增量
# schema_only: 只捕获结构变更，不读取数据
# never: 不执行快照，直接监听增量
snapshot.mode=initial

# 快照隔离级别（避免阻塞源数据库）
snapshot.isolation.mode=read_committed

# 快照锁定模式（none = 不锁定源表，减少影响）
snapshot.locking.mode=none

# 快照分批大小（减少内存压力）
snapshot.fetch.size=10000

# 批量读取大小
max.batch.size=1024
max.queue.size=8192

# 主题配置
topic.creation.groups=debezium-topics
topic.creation.debezium-topics.partitions=3
topic.creation.debezium-topics.replication.factor=1
topic.creation.debezium-topics.cleanup.policy=delete
topic.creation.debezium-topics.retention.ms=604800000

# 错误处理（发送到死信队列）
errors.tolerance=all
errors.deadletterqueue.topic.name=gaussdb-cdc-deadletterqueue
errors.deadletterqueue.topic.partitions=3
errors.deadletterqueue.context.headers.enable=true
errors.log.include.messages=true

# 时间戳配置
time.precision.mode=connect

# 刷新间隔（确保及时消费）
flush.lsn.enabled=true

# ------------------------------
# SMT (Single Message Transform) 配置
# 简化消息格式，提取核心数据
# ------------------------------

# 1. 提取新记录状态（unwrap）
transforms=unwrap,flatten,addHeaders,route
transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
transforms.unwrap.drop.tombstones=true  # 删除 DELETE 产生的 tombstone 消息
transforms.unwrap.delete.handling.mode=rewrite  # DELETE 操作保留前值，标记为删除
transforms.unwrap.add.source.fields=lsn,txId,ts_ms  # 添加源数据库元数据
transforms.unwrap.add.fields=op,ts_ms,lsn  # 添加操作类型、时间戳、LSN

# 2. 扁平化结构
transforms.flatten.type=org.apache.kafka.connect.transforms.Flatten
transforms.flatten.delimiter=_

# 3. 添加自定义头信息（方便消费者处理）
transforms.addHeaders.type=org.apache.kafka.connect.transforms.InsertHeader
transforms.addHeaders.headers=__operation:op,__lsn:source_lsn,__txid:source_txId,__ts_ms:ts_ms

# 4. 主题路由（可选：重命名主题）
# transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
# transforms.route.regex=gaussdb-cdc.jl_data01.ods_rt_szdn_snapshot_flow_addcode
# transforms.route.replacement=ods-rt-szdn-snapshot-flow

# 日志级别
log.level=INFO
