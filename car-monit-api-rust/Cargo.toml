[package]
name = "car-monit-api-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "car-monit-api (Java/Spring Boot) 的 Rust 1:1 迁移实现"

[dependencies]
# Web / 运行时 —— Java: spring-boot-starter-web + 内嵌 Tomcat
axum = { version = "0.8.1", features = ["macros"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.2", features = ["trace", "cors", "catch-panic", "limit", "timeout"] }
hyper = "1.5.2"

# 序列化 —— Java: Jackson / fastjson2
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }

# 数据访问 —— Java: MyBatis-Plus + Druid + PageHelper
sqlx = { version = "0.8.3", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
    "json",
    "bigdecimal",
] }

# 缓存 —— Java: spring-data-redis (Lettuce)
redis = { version = "0.27.5", features = ["tokio-comp", "connection-manager"] }

# HTTP 客户端 —— Java: RestHighLevelClient / Forest
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }

# 消息队列 —— Java: spring-kafka
rdkafka = { version = "0.37.0", features = ["cmake-build", "tokio"] }

# 配置 —— Java: application.yml + @Value / @ConfigurationProperties
config = { version = "0.15.7", default-features = false, features = ["yaml"] }

# 时间 / UUID —— Java: java.util.Date / UUID
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }

# 日志 —— Java: SLF4J + Logback
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# 错误处理 —— Java: Exception / @ControllerAdvice
thiserror = "2.0.9"
anyhow = "1.0.95"

# 其它
async-trait = "0.1.86"
csv = "1.3.1"
futures = "0.3.31"
once_cell = "1.20.2"
dashmap = "6.1.0"
sha1_smol = "1.0.1"
url = "2.5.4"
bigdecimal = "0.4.7"

[dev-dependencies]
pretty_assertions = "1.4.1"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
